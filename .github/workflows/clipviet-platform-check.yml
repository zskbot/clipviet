name: ClipViet platform checks

on:
  pull_request:
    paths:
      - "worker/telegram-api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Telegram Worker syntax and adapter tests
        run: |
          set -euo pipefail
          find worker/telegram-api -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do node --input-type=module --check < "$file"; done
          npm --prefix worker/telegram-api run test:providers

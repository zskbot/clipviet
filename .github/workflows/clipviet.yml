name: Run Tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clipviet:
    name: Optional application and Provider Registry tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run application checks
        run: |
          npm run lint
          npm test
          npm run build

name: Deploy ClipViet to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/browse/index.html
          test -s site/watch/index.html
          test -s site/watch/source.html
          test -s site/admin/sources/index.html
          test -s site/telegram/index.html
          test -s site/CNAME
          test -s site/.nojekyll
          find site -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do
              node --input-type=module --check < "$file"
            done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

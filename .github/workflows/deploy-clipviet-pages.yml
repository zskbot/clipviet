name: Deploy ClipViet.live to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-clipviet-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site/ to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          set -eu
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/data.js
          test -s site/admin/index.html
          test -s site/admin/admin.js
          test "$(cat site/CNAME)" = "clipviet.live"
          test ! -e site/package.json
          find site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              node --input-type=module --check < "$file"
            done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

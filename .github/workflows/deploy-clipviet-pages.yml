name: Deploy ClipViet.live static site to GitHub Pages

on:
  # Manual publication only; no automatic production deploy on push or PR.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate static site artifact
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/data.js
          echo "Static site files are present."
          echo "Files to publish:"
          find site -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

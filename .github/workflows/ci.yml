name: CI (manual diagnostics)

on:
  # Static Preview builds run directly on Cloudflare Pages.
  # Backend tests, Next.js build and PHP lint run on the independent GitLab runner.
  # Keep this workflow for optional GitHub-hosted diagnostics only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static site
        run: |
          set -eu
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/watch/source.html
          test -s site/watch/source-player.js
          find site -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0 |
            while IFS= read -r -d '' file; do node --input-type=module --check < "$file"; done
